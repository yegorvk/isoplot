[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/yegorvk/isoplot"
license = "MPL-2.0"

[workspace.dependencies]
# Workspace
isoplot-eval = { path = "crates/isoplot_eval", version = "0.1.0" }
isoplot-mesh = { path = "crates/isoplot_mesh", version = "0.1.0" }

# External
anyhow = "1"
arrayvec = "0.7"
bilge = "0.3"
bytemuck = "1"
bumpalo = "3"
dashmap = "6"
derive-where = "1"
fearless_simd = "1"
fearless_simd_macros = "0.1"
glam = "0.32"
itertools = "0.15"
thiserror = "2"

[profile.dev.package.isoplot-demo]
opt-level = 1

[profile.dev.package.isoplot-mesh]
opt-level = 1

[profile.dev.package.isoplot-eval]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = "symbols"

[profile.release-lto]
inherits = "release"
lto = "thin"
panic = "abort"
