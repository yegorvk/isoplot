[package]
name = "isoplot-bevy"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
isoplot-mesh.workspace = true
glam.workspace = true
bytemuck = "1.25.0"
dashmap.workspace = true

[dependencies.bevy]
version = "0.18.1"
default-features = false
features = ["default_platform", "3d_bevy_render", "bevy_log"]

[dependencies.log]
version = "*"
features = ["max_level_debug", "release_max_level_warn"]
